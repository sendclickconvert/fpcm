<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <rect width="800" height="1000" fill="#F7F4EE"/>
  <!-- Subtle triangle pattern -->
  <g opacity="0.06" fill="#1E2856">
    <polygon points="0,0 200,0 0,200"/>
    <polygon points="400,0 600,0 400,200"/>
    <polygon points="200,200 400,200 200,400"/>
    <polygon points="600,200 800,200 600,400"/>
    <polygon points="0,400 200,400 0,600"/>
    <polygon points="400,400 600,400 400,600"/>
    <polygon points="200,600 400,600 200,800"/>
    <polygon points="600,600 800,600 600,800"/>
    <polygon points="0,800 200,800 0,1000"/>
    <polygon points="400,800 600,800 400,1000"/>
  </g>
  <!-- Centered steeple logo -->
  <g transform="translate(400, 480)">
    <circle r="90" fill="#1E2856" opacity="0.92"/>
    <path d="M0 -60 L0 -68 M-6 -68 L6 -68" stroke="#fff" stroke-width="2.5" fill="none"/>
    <path d="M-14 -54 L14 -54 L8 -38 L-8 -38 Z" fill="#fff"/>
    <rect x="-10" y="-36" width="20" height="22" fill="#fff"/>
    <rect x="-22" y="-12" width="44" height="50" fill="#fff"/>
    <rect x="-8" y="4" width="6" height="14" fill="#1E2856"/>
    <rect x="2" y="4" width="6" height="14" fill="#1E2856"/>
  </g>
  <!-- Caption -->
  <text x="400" y="640" font-family="Georgia, serif" font-size="32" font-weight="500" fill="#1E2856" text-anchor="middle" opacity="0.65">First Presbyterian Church</text>
  <text x="400" y="680" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3" fill="#7A7672" text-anchor="middle">PHOTO COMING SOON</text>
</svg>
